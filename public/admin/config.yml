# Decap CMS 配置
# 文档: https://decapcms.org/docs/

backend:
  name: github
  repo: cher9lie/cher9lie.github.io
  branch: main
  base_url: https://oauth.050418.xyz
  commit_messages:
    create: '通过 Decap 新建{{collection}}“{{slug}}”'
    update: '通过 Decap 更新{{collection}}“{{slug}}”'
    delete: '通过 Decap 删除{{collection}}“{{slug}}”'
    uploadMedia: '通过 Decap 上传“{{path}}”'
    deleteMedia: '通过 Decap 删除媒体“{{path}}”'
    openAuthoring: '{{message}}'

# 在管理界面中提供返回网站和查看内容的入口
site_url: https://050418.xyz
display_url: https://050418.xyz

# 界面语言
locale: zh

# 全局媒体文件夹（当集合未指定时使用）
# 博客集合会覆盖此设置，将图片存放在文章同目录下
media_folder: public/images/uploads
public_folder: /images/uploads

# 发布工作流（可选，需要 GitHub 仓库开启 branch protection）
# publish_mode: editorial_workflow

collections:
  # ─── 博客文章 ─────────────────────────────────────────────
  - name: blog
    label: 博客文章
    label_singular: 文章
    description: '适合日常撰写和修改 Markdown 文章；复杂 MDX 请使用 code.050418.xyz。'
    folder: src/content/blog
    create: true
    # 每篇文章创建独立子目录：src/content/blog/my-post/index.md
    slug: "{{slug}}"
    path: "{{slug}}/index"
    # 图片上传到文章所在目录，与现有 ./thumbnail.jpg 模式一致
    media_folder: ""
    public_folder: "./"
    # 按发布日期降序排列
    sortable_fields: ["publishDate", "title"]
    preview_path: "blog/{{slug}}"
    view_filters:
      - label: 草稿
        field: draft
        pattern: true
    view_groups:
      - label: 语言
        field: language
    fields:
      - label: 标题
        name: title
        widget: string
        hint: "最多 60 个字符"
        pattern:
          - '^.{1,60}$'
          - "标题应为 1–60 个字符"

      - label: 发布日期
        name: publishDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "格式：2025-01-01"

      - label: 更新日期
        name: updatedDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
        hint: "可选，文章有修改时填写"

      - label: 摘要描述
        name: description
        widget: string
        hint: "最多 160 个字符，用于 SEO 和文章列表展示"
        pattern:
          - '^.{1,160}$'
          - "摘要应为 1–160 个字符"

      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
        hint: "回车添加，标签会被统一转为小写"

      - label: 语言
        name: language
        widget: select
        options:
          - label: 中文
            value: Chinese
          - label: 英文
            value: English
        required: false

      - label: 封面图片
        name: heroImage
        widget: object
        required: false
        hint: "上传图片后，文件会保存在文章目录下（如 ./thumbnail.jpg）"
        fields:
          - label: 图片文件
            name: src
            widget: image
            required: false
            hint: "建议命名为 thumbnail.jpg"
          - label: 图片替代文本
            name: alt
            widget: string
            required: false
            hint: "简要说明图片内容，供无障碍阅读和图片加载失败时使用"
          - label: 背景主色调
            name: color
            widget: string
            required: false
            pattern:
              - "^#[0-9A-Fa-f]{3,6}$"
              - "请输入十六进制颜色值，例如 #D58388"
            hint: "用于图片加载前的占位背景色，例如 #D58388"

      - label: 草稿
        name: draft
        widget: boolean
        default: true
        hint: "新文章默认是草稿；确认内容无误后关闭此开关才会公开显示"

      - label: 允许评论
        name: comment
        widget: boolean
        default: true

      - label: 正文内容
        name: body
        widget: markdown
        hint: "支持 Markdown 语法"

  # ─── 普通 Markdown 文档 ───────────────────────────────────
  # 当前 Decap 版本无法安全遍历现有的混合 .md/.mdx 子目录，因此这里只列出
  # 已有的普通 Markdown 文件。新建文档和带组件的 MDX 使用 code-server。
  - name: docs_markdown
    label: 文档（Markdown）
    description: '可安全编辑现有普通 .md；新建文档或修改 .mdx 请使用 code.050418.xyz。'
    files:
      - name: setup_configuration
        label: 设置 / 配置
        file: src/content/docs/setup/configuration.md
        preview_path: docs/setup/configuration
        fields: &docs_fields
          - label: 标题
            name: title
            widget: string
            hint: "最多 60 个字符"
            pattern:
              - '^.{1,60}$'
              - "标题应为 1–60 个字符"
          - label: 摘要描述
            name: description
            widget: string
            hint: "最多 160 个字符"
            pattern:
              - '^.{1,160}$'
              - "摘要应为 1–160 个字符"
          - label: 排序
            name: order
            widget: number
            value_type: int
            min: 0
            default: 999
            hint: "数字越小，在同一分组中越靠前"
          - label: 发布日期
            name: publishDate
            widget: datetime
            format: "YYYY-MM-DD"
            date_format: "YYYY-MM-DD"
            time_format: false
            required: false
          - label: 更新日期
            name: updatedDate
            widget: datetime
            format: "YYYY-MM-DD"
            date_format: "YYYY-MM-DD"
            time_format: false
            required: false
          - label: 标签
            name: tags
            widget: list
            required: false
            default: []
            hint: "回车添加，标签会被统一转为小写"
          - label: 草稿
            name: draft
            widget: boolean
            default: false
            hint: "开启后不会在正式站点显示"
          - label: 正文内容
            name: body
            widget: markdown
            hint: "仅支持普通 Markdown；需要 Astro 组件时请改用 MDX 和 code-server"

      - name: advanced_faq
        label: 高级 / 常见问题
        file: src/content/docs/advanced/faq.md
        preview_path: docs/advanced/faq
        fields: *docs_fields

      - name: integrations_unocss
        label: 集成 / UnoCSS
        file: src/content/docs/integrations/unocss.md
        preview_path: docs/integrations/unocss
        fields: *docs_fields
